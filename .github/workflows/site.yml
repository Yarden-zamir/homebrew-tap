# Builds the catalog page and deploys it to brew.yarden-zamir.com.
# Formula bumps land on main through automerge with the built-in token, and pushes made
# with that token do not start other workflows. So the site also rebuilds when the
# automerge or sync formula workflows finish.
name: site

on:
  push:
    branches: [main]
    paths: [Formula/**, site/**, .github/workflows/site.yml]
  workflow_run:
    workflows: [automerge, sync formula]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # build.mjs reads "last updated" dates from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build
        run: node site/build.mjs

      - name: Deploy
        run: npx --yes wrangler@4.147.0 deploy --config site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
