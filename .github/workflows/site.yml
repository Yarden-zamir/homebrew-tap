# Builds the catalog page and deploys it to brew.yarden-zamir.com with kitshn 2.
# Formula bumps reach main through automerge, which merges with the TOKEN secret, so
# those merges count as pushes and start this workflow.
name: site

on:
  push:
    branches: [main]
    paths: [Formula/**, site/**, kitshn.config.ts, .github/workflows/site.yml]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: [Formula/**, site/**, kitshn.config.ts, .github/workflows/site.yml]
  # kitshn 2 agent keys start a build of one branch (K-718).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # The closing of a pull request builds nothing; the kitshn job still removes its preview.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # build.mjs reads "last updated" dates from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build
        run: node site/build.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist

  kitshn:
    needs: build
    if: ${{ !cancelled() && !failure() }}
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    with:
      artifact: site
      artifact-path: site/dist
    secrets: inherit
